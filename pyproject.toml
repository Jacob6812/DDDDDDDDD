[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "darwintrade"
version = "1.0.0"
description = "Self-evolving multi-agent long/short equity trading system"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Jie Fang" },
    { name = "Shaolei Zhang" },
]
keywords = ["trading", "llm-agents", "portfolio", "quantitative-finance"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Kept in sync with requirements.txt, which stays the canonical list for the
# reproduction path. Direct dependencies only — let pip resolve transitives so
# we do not pin incompatible subdependencies across platforms.
dependencies = [
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<3.0",
    "scipy>=1.11,<2.0",
    "pyarrow>=15.0,<25.0",
    "pydantic>=2.8,<3.0",
    "python-dotenv>=1.0,<2.0",
    "PyYAML>=6.0,<7.0",
    "typer>=0.12,<1.0",
    "rich>=13.0,<16.0",
    "loguru>=0.7,<1.0",
    "openai>=2.0,<3.0",
    "langchain-core>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "cvxpy>=1.6,<2.0",
    "httpx>=0.27,<1.0",
    "finnhub-python>=2.4,<3.0",
    "yfinance>=0.2.50,<2.0",
    "akshare>=1.15,<2.0",
    "json-repair>=0.30,<1.0",
    "demjson3>=3.0,<4.0",
    "beautifulsoup4>=4.12,<5.0",
    "matplotlib>=3.8,<4.0",
    "statsmodels>=0.14,<1.0",
    "xgboost>=2.0,<4.0",
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<8.0",
]

[project.urls]
Repository = "https://github.com/Jacob6812/DarwinTrade"

[project.scripts]
darwintrade = "darwintrade.live.cli:main"

[tool.setuptools]
# `backtest` is a sibling top-level package, not a subpackage of darwintrade.
# `darwintrade.skills` maps the repo-root `skills/` directory into the package so
# an installed wheel can still find the agent prompts (see core/skills.py).
packages = [
    "darwintrade",
    "darwintrade.agents",
    "darwintrade.agentic",
    "darwintrade.agentic.analysts",
    "darwintrade.agentic.analysts._helpers",
    "darwintrade.agentic.tooling",
    "darwintrade.agentic.tooling.toolbox",
    "darwintrade.core",
    "darwintrade.integrations",
    "darwintrade.integrations.llm",
    "darwintrade.live",
    "darwintrade.memory",
    "darwintrade.portfolio",
    "darwintrade.skills",
    "backtest",
    "backtest.stockbench",
    "backtest.stockbench.adapters",
    "backtest.stockbench.agents",
    "backtest.stockbench.core",
    "backtest.stockbench.llm",
    "backtest.stockbench.scripts",
    "backtest.stockbench.strategies",
    "backtest.stockbench.utils",
]

[tool.setuptools.package-data]
"darwintrade.live" = ["static/*"]
"darwintrade.skills" = ["*/SKILL.md", "*/references/*.md"]
"backtest.stockbench" = ["*.yaml", "ablation/*.yaml"]

# `skills/` sits at the repo root but must ship inside the package so an
# installed wheel can find the agent prompts (see darwintrade/core/skills.py).
[tool.setuptools.package-dir]
"darwintrade.skills" = "skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_llm: test calls a live LLM endpoint instead of the stub",
]
